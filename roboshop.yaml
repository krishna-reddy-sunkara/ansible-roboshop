- name: create ec2 instance and route53 records
  hosts: all #no need to use inventory file
  connection: local
  vars:
   sg_id: sg-0027bf26309cfab1a
   ami_id: ami-0220d79f3f480ecf5
   domain_name: daws-92s.store
   env: dev
   instances:
   - mongodb
   - catalogue 

  tasks:
  - name: to create ec2 instance
    amazon.aws.ec2_instance:
     instance_type: "t3.micro"
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
     name: "{{ item }}"
     tags:
      Project: roboshop
      Component: "{{ item }}"
      Environment: "{{ env }}"
      name: "{{ item }}-{{ env }}"

    loop: "{{ instances }}"
    register: ec2_output

  - name: print the ec2 output
    ansible.builtin.debug:
     msg: "{{ ec2_output }}"

  - name: create athe route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" # mongodb-dev.daws-92s.store
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true  
    loop: "{{ ec2_output.results }}"    